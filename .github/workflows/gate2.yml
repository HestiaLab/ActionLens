# Gate 2 — the release gate for ActionLens
#
# This is the executable form of the seven criteria in CHANGELOG.md ("Gate 2 — the release gate").
# It is deliberately strict: TreatWarningsAsErrors is on, `dotnet format` is a hard gate, both xUnit
# v3 / Microsoft.Testing.Platform assemblies run as executables (dotnet test is not supported on this
# SDK), and the Playwright suite drives a real Chromium against the real WASM host.
#
# Both integration branches are gated: day-to-day commits land on `dev`, and `main` is the stable
# branch they are merged into. A commit on either one runs the same checks.
#
# No deployment job is defined here. Creating the Pages deployment happens only after this workflow is
# green (decision Q5 in docs/review-v1-grill.md); publishing is a separate, explicit act.

name: gate2

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: gate2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: build, format and xUnit v3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The editor bundle is generated, not committed (.gitignore excludes it).
      # Building it here also proves the npm step is not silently skipped.
      - name: Install Node dependencies
        run: npm ci

      - name: Build the CodeMirror bundle
        run: npm run build:editor

      - name: Restore
        run: dotnet restore ActionLens.sln

      - name: Build (0 errors / 0 warnings)
        run: dotnet build ActionLens.sln --no-restore -v q --nologo

      - name: Format gate
        run: dotnet format ActionLens.sln --verify-no-changes --no-restore

      - name: Core contract, corpus and documentation tests
        run: dotnet tests/ActionLens.Core.Tests/bin/Debug/net10.0/ActionLens.Core.Tests.dll

      - name: bUnit component tests
        run: dotnet tests/ActionLens.Ui.Tests/bin/Debug/net10.0/ActionLens.Ui.Tests.dll

  browser:
    name: Playwright (real Chromium)
    runs-on: ubuntu-latest
    needs: engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build the CodeMirror bundle
        run: npm run build:editor

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Gate 2 browser assertions
        run: npm run test:e2e
        env:
          CI: 'true'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
